name: Build and test

# Tests HAMAL Linux and builds the snap for review. This workflow never publishes: there is no
# Snap Store login here and no upload or release step. Publishing is a separate, approved step.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # go.mod replaces github.com/i1k3r/HAMAL with ../HAMAL. This is the commit go.mod records
  # (v0.0.0-20261115113322-6fad72ec956e); the in-process server is not changed by this workflow.
  HAMAL_SERVER_REF: 6fad72ec956e8db57a0c2b705d84eaaf3a0bbafe
  # The published Docker release that HAMAL Linux must match: ghcr.io/i1k3r/hamal:latest
  # (= sha-6fad72e) on 2026-11-15, pinned by digest so the check cannot drift.
  HAMAL_REFERENCE_IMAGE: ghcr.io/i1k3r/hamal@sha256:623bb9a66d8de1adbca100d174f3b7d1db05295f94a2d55bf12ffdad1cea512a

jobs:
  test:
    name: Test and build binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout HAMAL-Linux
        uses: actions/checkout@v4
        with:
          path: HAMAL-Linux

      - name: Checkout the pinned HAMAL server module
        uses: actions/checkout@v4
        with:
          repository: i1k3r/HAMAL
          ref: ${{ env.HAMAL_SERVER_REF }}
          path: HAMAL

      - name: Check the server pin matches go.mod
        working-directory: HAMAL-Linux
        run: |
          grep -q "github.com/i1k3r/HAMAL v0.0.0-[0-9]*-${HAMAL_SERVER_REF:0:12}$" go.mod \
            || { echo "go.mod does not record HAMAL commit ${HAMAL_SERVER_REF:0:12}"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: HAMAL-Linux/go.mod
          cache-dependency-path: HAMAL-Linux/go.sum

      - name: Install GTK and WebKitGTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Check translations and frontend scripts
        working-directory: HAMAL-Linux
        run: |
          node scripts/check-i18n.mjs
          for f in frontend/src/*.js; do node --check "$f"; done

      - name: Check the room CSS is the reference lighttable.css
        working-directory: HAMAL-Linux
        run: scripts/check-css-parity.sh ../HAMAL

      - name: go vet
        working-directory: HAMAL-Linux
        run: go vet ./...

      - name: go test
        working-directory: HAMAL-Linux
        run: go test -count=1 ./...

      - name: Parity check against the Docker reference
        working-directory: HAMAL-Linux
        run: |
          docker run -d --name hamal-reference -p 127.0.0.1:7700:7700 "$HAMAL_REFERENCE_IMAGE"
          revision="$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' hamal-reference)"
          echo "Reference image revision label: ${revision:-none}"
          if [ -n "$revision" ] && [ "$revision" != "$HAMAL_SERVER_REF" ]; then
            echo "The reference image was built from $revision, not $HAMAL_SERVER_REF"; exit 1
          fi
          for i in $(seq 30); do curl -fsS http://127.0.0.1:7700/readyz && break; sleep 1; done
          HAMAL_REFERENCE_URL=http://127.0.0.1:7700 HAMAL_PARITY_REPORT="$PWD/parity-report.md" \
            go test -count=1 -run TestParityWithReferenceServer -v . 2>&1 | grep -v ' level='
          test "${PIPESTATUS[0]}" -eq 0
          grep -q 'Result: \*\*no differences\*\*' parity-report.md
          cat parity-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: HAMAL-Linux/parity-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Build binary from VERSION
        working-directory: HAMAL-Linux
        run: scripts/build.sh HAMAL-Linux

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: HAMAL-Linux-binary
          path: HAMAL-Linux/HAMAL-Linux
          if-no-files-found: error
          retention-days: 14

  snap:
    name: Build snap for review
    # Builds the snap from source like Launchpad does. The binary artifact from the test job is
    # an independent check and is not used here.
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout HAMAL-Linux
        uses: actions/checkout@v4

      # Launchpad builds from a clean checkout, so the snap must not depend on the binary artifact.
      - name: Check the checkout has no prebuilt binary
        run: |
          test ! -e HAMAL-Linux || { echo "HAMAL-Linux must not be in the source tree"; exit 1; }
          PIN="$(sed -n 's/^ *source-commit: *//p' snap/snapcraft.yaml)"
          [ "$PIN" = "$HAMAL_SERVER_REF" ] || { echo "snapcraft.yaml pins HAMAL at '$PIN', not $HAMAL_SERVER_REF"; exit 1; }

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Check snap metadata
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          unsquashfs -q -d snap-root "$SNAP_FILE" meta/snap.yaml
          cat snap-root/meta/snap.yaml
          grep -qx "version: '\?${VERSION}'\?" snap-root/meta/snap.yaml || { echo "snap version is not ${VERSION}"; exit 1; }
          grep -qx "confinement: strict" snap-root/meta/snap.yaml || { echo "snap is not strictly confined"; exit 1; }
          grep -qx "license: Proprietary" snap-root/meta/snap.yaml || { echo "snap license is not Proprietary"; exit 1; }
          # Validate the packed metadata (including the license) with snapd's own validator, as the store does.
          snap version
          unsquashfs -q -d snap-full "$SNAP_FILE"
          snap pack --check-skeleton snap-full
          # The binary was built inside the snap build and must carry the version from VERSION.
          grep -aq "v${VERSION}" snap-full/usr/bin/HAMAL-Linux || { echo "snap binary does not contain v${VERSION}"; exit 1; }
          file snap-full/usr/bin/HAMAL-Linux
          # The build only rewrites the replace directive in its own copy of go.mod.
          git diff --exit-code -- go.mod go.sum
          case "$(basename "$SNAP_FILE")" in hamal_${VERSION}_*.snap) ;; *) echo "unexpected snap file name $SNAP_FILE"; exit 1;; esac
          sha256sum "$SNAP_FILE"

      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: hamal-snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 30
