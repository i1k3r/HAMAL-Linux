name: hamal
title: HAMAL File Transfer
# The version comes from the VERSION file (see adopt-info and override-build below).
adopt-info: hamal
summary: Fast, private, temporary file transfer between devices
description: |
  HAMAL is a simple, privacy-focused file transfer application for moving files between devices on your local network through temporary rooms.

  Open a room on the desktop and lay files on the table. Phones, tablets and other computers on the same network join by scanning the room's QR code with a browser, with no app or account. Files travel over your local network to and from this computer and never pass through a cloud service. When the room expires or you close it, its files are deleted.

  Features:
  - Temporary rooms from 5 minutes to 24 hours, with a lamp that shows how long the room has left
  - QR-code based device joining
  - Optional PIN protection (4 to 8 characters)
  - Native file dialogs and drag and drop onto the table
  - Download → Saved state
  - Executable file warnings
  - Automatic room expiration
  - Dark and light themes that follow the desktop
  - 20 languages
  - Updates arrive automatically through the Snap Store

  Transfers use plain HTTP on the local network, so use HAMAL on networks you trust.

grade: stable
confinement: strict
base: core24
# LICENSE is the custom "HAMAL Source-Available Organizational Use License", which has no SPDX
# identifier. "Proprietary" is the non-SPDX value snapd and the Snap Store accept for that case
# (snapd spdx/licenses.go); snapcraft passes it through to meta/snap.yaml.
license: Proprietary
website: https://github.com/i1k3r/HAMAL-Linux
issues: https://github.com/i1k3r/HAMAL-Linux/issues
source-code: https://github.com/i1k3r/HAMAL-Linux
contact: https://github.com/i1k3r/HAMAL-Linux

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/webkit2gtk-4.1
  /usr/libexec/webkit2gtk-4.1:
    bind: $SNAP/usr/libexec/webkit2gtk-4.1

apps:
  hamal:
    command: usr/bin/HAMAL-Linux
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - removable-media
    desktop: usr/share/applications/hamal.desktop
    environment:
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"

parts:
  hamal:
    plugin: nil
    source: .
    stage-packages:
      - libwebkit2gtk-4.1-0
    override-build: |
      # VERSION is the single source of truth for the snap version and the binary's AppVersion.
      VERSION="$(tr -d '[:space:]' < VERSION)"
      craftctl set version="$VERSION"

      # The binary must have been built from this VERSION by scripts/build.sh.
      if ! grep -aq "v${VERSION}" HAMAL-Linux; then
        echo "HAMAL-Linux was not built with version v${VERSION}; run scripts/build.sh first" >&2
        exit 1
      fi

      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/bin
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/applications
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps

      # Install the verified Linux ELF binary
      cp -f HAMAL-Linux $SNAPCRAFT_PART_INSTALL/usr/bin/HAMAL-Linux
      chmod +x $SNAPCRAFT_PART_INSTALL/usr/bin/HAMAL-Linux

      # Install desktop launcher entry and icon
      cp -f snap/gui/hamal.desktop $SNAPCRAFT_PART_INSTALL/usr/share/applications/hamal.desktop
      cp -f snap/gui/hamal.svg $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/hamal.svg
      cp -f snap/gui/hamal.png $SNAPCRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/hamal.png

