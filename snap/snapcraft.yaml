name: hamal
title: HAMAL File Transfer
# The version comes from the VERSION file (see adopt-info and override-build below).
adopt-info: hamal
summary: Fast, private, temporary file transfer between devices
description: |
  HAMAL is a simple, privacy-focused file transfer application for moving files between devices on your local network through temporary rooms.

  Open a room on the desktop and lay files on the table. Phones, tablets and other computers on the same network join by scanning the room's QR code with a browser, with no app or account. Files travel over your local network to and from this computer and never pass through a cloud service. When the room expires or you close it, its files are deleted.

  Features:
  - Temporary rooms from 5 minutes to 24 hours, with a lamp that shows how long the room has left
  - QR-code based device joining
  - Optional PIN protection (4 to 8 characters)
  - Native file dialogs and drag and drop onto the table
  - Download → Saved state
  - Executable file warnings
  - Automatic room expiration
  - Dark and light themes that follow the desktop
  - 20 languages
  - Updates arrive automatically through the Snap Store

  Transfers use plain HTTP on the local network, so use HAMAL on networks you trust.

grade: stable
confinement: strict
base: core24
# LICENSE is the custom "HAMAL Source-Available Organizational Use License", which has no SPDX
# identifier. "Proprietary" is the non-SPDX value snapd and the Snap Store accept for that case
# (snapd spdx/licenses.go); snapcraft passes it through to meta/snap.yaml.
license: Proprietary
website: https://github.com/i1k3r/HAMAL-Linux
issues: https://github.com/i1k3r/HAMAL-Linux/issues
source-code: https://github.com/i1k3r/HAMAL-Linux
contact: https://github.com/i1k3r/HAMAL-Linux

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/webkit2gtk-4.1
  /usr/libexec/webkit2gtk-4.1:
    bind: $SNAP/usr/libexec/webkit2gtk-4.1

apps:
  hamal:
    command: usr/bin/HAMAL-Linux
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - removable-media
    desktop: usr/share/applications/hamal.desktop
    environment:
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"

parts:
  # The HAMAL server module, pinned to the commit go.mod records
  # (github.com/i1k3r/HAMAL v0.0.0-20260822183927-0072645cba81). It is only a build input:
  # nothing from this part is installed into the snap.
  hamal-server:
    plugin: nil
    source: https://github.com/i1k3r/HAMAL.git
    source-type: git
    source-commit: 0072645cba81dd4f2929f5c9e73dc901da1af3c3
    override-build: |
      true

  hamal:
    after: [hamal-server]
    plugin: nil
    source: .
    build-snaps:
      - go/1.25/stable
    build-packages:
      - build-essential
      - pkg-config
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
    stage-packages:
      - libwebkit2gtk-4.1-0
    build-environment:
      - CGO_ENABLED: "1"
      # Use the Go from build-snaps; never download another toolchain.
      - GOTOOLCHAIN: local
    override-build: |
      set -euo pipefail

      # VERSION is the single source of truth for the snap version and the binary's AppVersion.
      VERSION="$(tr -d '[:space:]' < VERSION)"
      craftctl set version="$VERSION"

      # go.mod replaces github.com/i1k3r/HAMAL with ../HAMAL for local development and CI.
      # Here, point it at the pinned hamal-server checkout instead. This edits only this
      # part's build copy of go.mod, never the repository.
      # craft-parts keeps each part's source in <parts dir>/<part name>/src and exports no
      # variable for the parts dir, so derive it from this part's own $CRAFT_PART_SRC.
      SERVER_SRC="$(dirname "$(dirname "$CRAFT_PART_SRC")")/hamal-server/src"
      SERVER_COMMIT="$(git -C "$SERVER_SRC" rev-parse HEAD)"
      if [ "$SERVER_COMMIT" != "0072645cba81dd4f2929f5c9e73dc901da1af3c3" ]; then
        echo "hamal-server is at $SERVER_COMMIT, not the pinned commit" >&2
        exit 1
      fi
      if ! grep -Eq "github.com/i1k3r/HAMAL v0\.0\.0-[0-9]{14}-${SERVER_COMMIT:0:12}\$" go.mod; then
        echo "go.mod does not require github.com/i1k3r/HAMAL at ${SERVER_COMMIT:0:12}" >&2
        exit 1
      fi
      go mod edit -replace "github.com/i1k3r/HAMAL=$SERVER_SRC"
      go version

      # Build from source; scripts/build.sh injects VERSION and checks the binary carries it.
      mkdir -p "$CRAFT_PART_INSTALL/usr/bin"
      scripts/build.sh "$CRAFT_PART_INSTALL/usr/bin/HAMAL-Linux"

      mkdir -p "$CRAFT_PART_INSTALL/usr/share/applications"
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps"
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps"

      # Install desktop launcher entry and icon
      cp -f snap/gui/hamal.desktop "$CRAFT_PART_INSTALL/usr/share/applications/hamal.desktop"
      cp -f snap/gui/hamal.svg "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/hamal.svg"
      cp -f snap/gui/hamal.png "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/hamal.png"
